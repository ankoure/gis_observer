[project]
name = "gis-observer"
version = "0.1.0"
description = "Discover public government GIS data layers on any platform, catalog them, and track how they change."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "lxml>=5.0",
]

[project.scripts]
gis-observer = "gis_observer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gis_observer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # `ruff format` owns line length; long URLs in fixtures stay unwrapped
